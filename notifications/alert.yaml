apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: java-webhook-alert
  namespace: flux-system
spec:
  providerRef:
    name: java-webhook-provider
  eventSeverity: info
  eventSources:
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
      namespace: flux-helm-demo