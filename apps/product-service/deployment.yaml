apiVersion: apps/v1
kind: Deployment
metadata:
  name: flux-product-service
  namespace: flux-demo
  labels:
    app: flux-product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flux-product-service
  template:
    metadata:
      labels:
        app: flux-product-service
    spec:
      containers:
        - name: product-service
          image: product-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080