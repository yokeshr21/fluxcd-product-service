
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-helm-product
  namespace: flux-helm-demo
spec:
  interval: 1m
  releaseName: flux-helm-product
  chart:
    spec:
      chart: ./charts/flux-product-service
      version: "0.1.0"
      sourceRef:
        kind: GitRepository
        name: fluxcd-product-service
        namespace: flux-system
      interval: 1m
  values:
    replicaCount: 1
    image:
      repository: product-service
      tag: "1.0"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    containerPort: 8080
    resources: {}
